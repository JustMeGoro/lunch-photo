<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch Photo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lunch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#5f6b57; --card:#f1f8e9; --accent:#558b2f; --ok:#2e7d32; --err:#b91c1c; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); max-width:480px; margin-inline:auto; }
  h1 { font-size:20px; margin:8px 0 12px; }
  h2 { font-size:15px; margin:0 0 8px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=date] { width:100%; padding:10px; font-size:16px; border-radius:8px; border:1px solid var(--muted); background:var(--bg); color:var(--fg); }
  button { width:100%; padding:14px; font-size:17px; border:0; border-radius:10px; background:var(--accent); color:#fff; margin-top:12px; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; }
  img { width:100%; border-radius:10px; margin-top:12px; display:block; }
  #meal { font-weight:600; }
  #status { margin-top:12px; min-height:1.4em; }
  .ok { color:var(--ok); } .err { color:var(--err); } .warn { color:var(--warn); }
  details summary { cursor:pointer; color:var(--muted); }
  .dayrow { display:flex; gap:8px; align-items:center; }
  .dayrow button { width:56px; margin-top:0; padding:10px 0; }
  .dayrow input { text-align:center; }
  small, .muted { color:var(--muted); }
  small { font-size:13px; }

  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { margin:0; padding:10px; font-size:15px; }
  .tabs button:not(.on) { background:transparent; color:var(--accent); border:1px solid var(--accent); }

  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; color:#fff; background:var(--muted); }
  .badge.running { background:var(--accent); } .badge.success { background:var(--ok); } .badge.failed { background:var(--err); }
  .meta { font-size:13px; color:var(--muted); margin-top:6px; }
  .meta a { color:var(--accent); }
  .failbox { border-left:4px solid var(--err); background:#fef2f2; border-radius:8px; padding:10px 12px; margin-top:10px; }
  .failbox b { color:var(--err); }
  .nextbox { border-left:4px solid var(--warn); background:#fffbeb; border-radius:8px; padding:10px 12px; margin-top:10px; }
  .phases { list-style:none; margin:0; padding:0; }
  .phases li { display:flex; gap:10px; padding:6px 0; border-bottom:1px solid #dcedc8; }
  .phases li:last-child { border-bottom:0; }
  .phases .ic { width:20px; text-align:center; flex:none; }
  .phases .dayhead { font-weight:600; font-size:13px; color:var(--muted); display:block; border-bottom:0; padding-bottom:0; margin-top:8px; }
  .phases .detail { font-size:13px; color:var(--muted); }
  .spin { display:inline-block; animation:spin 1s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
  .term { background:#14210f; color:#e6f0dc; border-radius:10px; padding:10px; font:12px/1.45 ui-monospace, Menlo, Consolas, monospace; max-height:340px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .term .t { color:#8aa079; } .term .warn { color:#fbbf24; } .term .error { color:#fca5a5; } .term .step { color:#a5d66b; font-weight:700; }
  .hist { list-style:none; margin:0; padding:0; font-size:14px; }
  .hist li { padding:5px 0; border-bottom:1px solid #dcedc8; } .hist li:last-child { border-bottom:0; }
  .qbanner { display:flex; gap:10px; align-items:center; background:#fffbeb; border-left:4px solid var(--warn); border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  .qbanner span { flex:1; }
  .qbanner button { width:auto; margin:0; padding:8px 14px; font-size:15px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .modal .sheet { background:var(--bg); width:100%; max-width:480px; max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px max(16px, env(safe-area-inset-bottom)); }
  .modal img { margin-top:8px; max-height:45vh; object-fit:contain; background:#000; }
  .modal .row { display:flex; gap:8px; }
  .modal .row > div:first-child { flex:1; } .modal .row > div:last-child { width:110px; }
  .modal .actions { display:flex; gap:8px; } .modal .actions button { margin-top:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>Lunch</h1>

<div class="qbanner" id="qBanner" hidden>
  <span id="qBannerText"></span>
  <button id="qBannerBtn">Answer</button>
</div>

<div class="tabs">
  <button id="tabPhoto" class="on">Photo</button>
  <button id="tabDash">Dashboard</button>
</div>

<section id="viewPhoto">
  <div class="card">
    <label for="date">Day</label>
    <div class="dayrow">
      <button id="prev" class="secondary" aria-label="Previous day">&lt;</button>
      <input type="text" id="date" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="off">
      <button id="next" class="secondary" aria-label="Next day">&gt;</button>
    </div>
    <div id="meal"></div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileGallery" accept="image/*" hidden>
    <button id="pickCamera" class="secondary">Take photo</button>
    <button id="pickGallery" class="secondary">Choose from gallery</button>
    <img id="preview" alt="" hidden>
    <button id="send" disabled>Send photo</button>
    <div id="status"></div>
  </div>
</section>

<section id="viewDash" hidden>
  <div class="card" id="dashHead"></div>
  <div class="card" id="dashPhases" hidden>
    <h2>Steps</h2>
    <ul class="phases" id="phaseList"></ul>
  </div>
  <div class="card">
    <h2>Terminal</h2>
    <div class="term" id="term">Nothing yet.</div>
    <div id="prevAttempt" hidden></div>
  </div>
  <div class="card">
    <h2>Recent runs</h2>
    <ul class="hist" id="hist"><li class="muted">Nothing yet.</li></ul>
  </div>
</section>

<details class="card" id="settings">
  <summary>Settings</summary>
  <label for="repo">Repository (owner/name)</label>
  <input type="text" id="repo" value="JustMeGoro/KalorickeTabulkySender" autocapitalize="off" autocomplete="off">
  <label for="token">GitHub token (this repo only, Contents: read and write)</label>
  <input type="password" id="token" autocomplete="off">
  <small>Stored only in this phone's browser.</small>
  <button id="save" class="secondary">Save</button>
  <label>Notifications</label>
  <small id="pushState">Ask me when the app is not sure about something on your tray.</small>
  <button id="pushBtn" class="secondary">Enable notifications</button>
</details>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h2 id="mTitle">Is this part of your lunch?</h2>
    <small id="mStep"></small>
    <img id="mImg" alt="">
    <div class="row">
      <div><label for="mName">What is it?</label><input type="text" id="mName" autocomplete="off"></div>
      <div><label for="mGrams">Grams</label><input type="text" id="mGrams" inputmode="numeric" autocomplete="off"></div>
    </div>
    <div id="mNote" class="muted"></div>
    <div class="actions">
      <button id="mSkip" class="secondary">Skip it</button>
      <button id="mAdd">Add it</button>
    </div>
    <div id="mStatus"></div>
    <button id="mClose" class="secondary">Later</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k) ?? ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const MAX_SIDE = 1280; // px - enough for judging portions, keeps the upload small
let blob = null;

const pad = (n) => String(n).padStart(2, "0");
const isoDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());
const say = (text, cls = "") => { $("status").textContent = text; $("status").className = cls; };
const clock = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "");
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

$("date").value = today();
$("repo").value = store.get("repo") || $("repo").value;
$("token").value = store.get("token");
if (!store.get("token")) $("settings").open = true;

const api = (path, opts = {}) =>
  fetch(`https://api.github.com/repos/${$("repo").value.trim()}/contents/${path}`, {
    ...opts,
    headers: { Authorization: `Bearer ${$("token").value.trim()}`, Accept: "application/vnd.github+json", ...(opts.headers ?? {}) },
  });

// ---- tabs -----------------------------------------------------------------------------------
function showTab(name) {
  $("viewPhoto").hidden = name !== "photo";
  $("viewDash").hidden = name !== "dash";
  $("tabPhoto").classList.toggle("on", name === "photo");
  $("tabDash").classList.toggle("on", name === "dash");
  store.set("tab", name);
  if (name === "dash") pollNow();
}
$("tabPhoto").onclick = () => showTab("photo");
$("tabDash").onclick = () => showTab("dash");

// ---- photo tab ----------------------------------------------------------------------------
// Show what lunch is planned for the chosen day (best effort; the app works without it).
async function showMeal() {
  $("meal").textContent = "";
  if (!$("token").value) return;
  try {
    const res = await api("lunches.json", { headers: { Accept: "application/vnd.github.raw+json" } });
    if (!res.ok) return;
    const lunch = (await res.json()).find((l) => l.date === $("date").value);
    $("meal").textContent = lunch ? lunch.name : "No lunch planned for this day";
  } catch {}
}

$("save").onclick = () => {
  store.set("repo", $("repo").value.trim());
  store.set("token", $("token").value.trim());
  say("Saved.", "ok");
  showMeal();
};
$("date").onchange = showMeal;
$("date").oninput = () => { if (/^\d{4}-\d{2}-\d{2}$/.test($("date").value)) showMeal(); };
const shiftDay = (n) => {
  const [y, m, d] = ($("date").value.match(/^\d{4}-\d{2}-\d{2}$/) ? $("date").value : today()).split("-").map(Number);
  $("date").value = isoDay(new Date(y, m - 1, d + n));
  showMeal();
};
$("prev").onclick = () => shiftDay(-1);
$("next").onclick = () => shiftDay(1);
$("pickCamera").onclick = () => $("fileCamera").click();
$("pickGallery").onclick = () => $("fileGallery").click();

// Downscale to MAX_SIDE and re-encode as JPEG.
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
}

async function onPicked(input) {
  const file = input.files[0];
  if (!file) return;
  say("Preparing photo...");
  try {
    blob = await shrink(file);
    $("preview").src = URL.createObjectURL(blob);
    $("preview").hidden = false;
    $("send").disabled = false;
    say(`Ready (${Math.round(blob.size / 1024)} kB).`);
  } catch (e) {
    say(`Could not read the photo: ${e.message}`, "err");
  }
}
$("fileCamera").onchange = (e) => onPicked(e.target);
$("fileGallery").onchange = (e) => onPicked(e.target);

const toBase64 = (b) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result.split(",")[1]);
  r.onerror = reject;
  r.readAsDataURL(b);
});

// What this phone did last, shown as the first step on the dashboard.
let lastUpload = null; // { day, state: "running" | "done" | "failed", at, error }
try { lastUpload = JSON.parse(store.get("lastUpload") || "null"); } catch {}
const setUpload = (u) => { lastUpload = u; store.set("lastUpload", JSON.stringify(u)); renderDash(); };

$("send").onclick = async () => {
  if (!blob) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test($("date").value)) return say("Day must look like 2026-10-12.", "err");
  if (!$("token").value) { $("settings").open = true; return say("Add your GitHub token in Settings first.", "err"); }
  $("send").disabled = true;
  say("Uploading...");
  const day = $("date").value;
  setUpload({ day, state: "running", at: new Date().toISOString() });
  try {
    const path = `photos/${day}.jpg`;
    // retaking a photo replaces the old file, which GitHub only allows with the old file's sha
    const existing = await api(path);
    const sha = existing.ok ? (await existing.json()).sha : undefined;
    const res = await api(path, {
      method: "PUT",
      body: JSON.stringify({ message: `Lunch photo ${day}`, content: await toBase64(blob), sha }),
    });
    if (!res.ok) throw new Error(`GitHub said ${res.status}: ${(await res.json().catch(() => ({}))).message ?? ""}`);
    setUpload({ day, state: "done", at: new Date().toISOString() });
    say("Uploaded. Follow the progress on the Dashboard tab.", "ok");
    fastUntil = Date.now() + 5 * 60_000;
    showTab("dash");
  } catch (e) {
    setUpload({ day, state: "failed", at: new Date().toISOString(), error: e.message });
    say(`Upload failed: ${e.message}`, "err");
  } finally {
    $("send").disabled = false;
  }
};

// ---- dashboard ----------------------------------------------------------------------------
const TRIGGERS = { push: "Photo uploaded", schedule: "Scheduled check", workflow_dispatch: "Started by hand", local: "Local run" };
// optional steps (only shown when the run reached them)
const DAY_STEPS = [
  ["photo", "Lunch photo", true],
  ["portions", "Reading the portions from the photo"],
  ["question", "Waiting for your answer", true],
  ["match-extras", "Matching the extra foods", true],
  ["write", "Writing the foods into the diary"],
  ["send", "Sharing the lunch"],
];
const GLOBAL_STEPS = [
  ["menu", "Downloading the canteen menu"],
  ["lunches", "Picking the lunch for each day"],
  ["ingredients", "Splitting the lunches into ingredients"],
  ["match", "Matching ingredients to foods"],
];
const ICONS = { done: "✓", running: "⟳", failed: "✗", pending: "○", skipped: "–", waiting: "⏸" };

let run = null;
let history = [];
const etags = {};

async function getStatus(file) {
  if (!$("token").value) return null;
  const headers = { Accept: "application/vnd.github.raw+json" };
  if (etags[file]) headers["If-None-Match"] = etags[file];
  const res = await api(`status/${file}?ref=status`, { headers, cache: "no-store" });
  if (res.status === 304) return undefined; // unchanged
  if (!res.ok) return null;
  etags[file] = res.headers.get("ETag");
  return res.json();
}

async function refresh() {
  try {
    const [r, h] = await Promise.all([getStatus("run.json"), getStatus("history.json")]);
    if (r !== undefined) run = r;
    if (h !== undefined && h) history = h;
    $("viewDash").dataset.error = "";
  } catch (e) {
    $("viewDash").dataset.error = e.message;
  }
  renderDash();
}

function renderPhase(list, p, fallbackLabel) {
  const li = el("li");
  const state = p?.state ?? "pending";
  const ic = el("span", "ic" + (state === "failed" ? " err" : state === "done" ? " ok" : ""), ICONS[state]);
  if (state === "running") ic.classList.add("spin");
  const body = el("div");
  body.append(el("div", "", p?.label ?? fallbackLabel));
  if (p?.detail) body.append(el("div", "detail", p.detail));
  li.append(ic, body);
  list.append(li);
}

function renderDash() {
  const head = $("dashHead");
  head.replaceChildren();
  if (!$("token").value) {
    head.append(el("div", "muted", "Add your GitHub token in Settings to see the dashboard."));
    return;
  }

  // the phone's own upload comes first: the cloud run only starts after it
  const up = lastUpload && Date.now() - new Date(lastUpload.at) < 30 * 60_000 ? lastUpload : null;
  const startedAfterUpload = run && up && new Date(run.startedAt) >= new Date(up.at) - 5000;
  if (up && (up.state !== "done" || !startedAfterUpload)) {
    const box = el("div", "nextbox");
    const text = up.state === "running" ? "Uploading the photo for " + up.day + "..." :
      up.state === "done" ? `Photo for ${up.day} uploaded at ${clock(up.at)}. Waiting for the cloud run to start...` :
      `Photo upload failed: ${up.error}`;
    box.append(el("b", up.state === "failed" ? "err" : "", up.state === "running" ? "⟳ " : up.state === "done" ? "✓ " : "✗ "), document.createTextNode(text));
    head.append(box);
  }

  if (!run) {
    head.append(el("div", "muted", "No run recorded yet. A run shows up here when a lunch is processed or something fails."));
    $("dashPhases").hidden = true;
    renderTerm([]);
    renderHist();
    return;
  }

  const stale = run.state === "running" && Date.now() - new Date(run.updatedAt) > 10 * 60_000;
  const state = stale ? "failed" : run.state;
  const top = el("div");
  top.append(el("span", `badge ${state}`, stale ? "Stopped?" : state === "running" ? "Running" : state === "success" ? "Done" : "Failed"));
  head.append(top);
  const trig = `${TRIGGERS[run.trigger] ?? run.trigger}${run.attempt > 1 ? ` - attempt ${run.attempt}` : ""}`;
  const dur = Math.max(0, Math.round(((run.finishedAt ? new Date(run.finishedAt) : new Date()) - new Date(run.startedAt)) / 1000));
  const meta = el("div", "meta", `${trig} - started ${clock(run.startedAt)} - ${dur} s`);
  if (run.runUrl) { meta.append(document.createTextNode(" - ")); const a = el("a", "", "GitHub"); a.href = run.runUrl; a.target = "_blank"; a.rel = "noopener"; meta.append(a); }
  head.append(meta);
  if (run.summary) head.append(el("div", "", run.summary));
  if (stale) head.append(el("div", "warn", `No update for ${Math.round((Date.now() - new Date(run.updatedAt)) / 60000)} min - the run may have been cancelled or crashed.`));

  if (run.failure) {
    const f = el("div", "failbox");
    f.append(el("b", "", `Failed at: ${run.failure.phase}${run.failure.day ? " (" + run.failure.day + ")" : ""}`));
    f.append(el("div", "", run.failure.reason));
    f.append(el("div", "muted", run.failure.hint));
    head.append(f);
  }
  if (run.next && run.state !== "running" && (run.state === "failed" || stale)) {
    const n = el("div", "nextbox");
    n.append(el("b", "", "Next attempt: "));
    n.append(document.createTextNode(nextText(run.next)));
    head.append(n);
  }

  // steps
  const list = $("phaseList");
  list.replaceChildren();
  const find = (id, day) => run.phases.find((p) => p.id === id && (p.day ?? null) === day);
  for (const [id, label] of GLOBAL_STEPS) {
    const p = find(id, null);
    if (p || run.state === "running") renderPhase(list, p, label);
  }
  const days = [...new Set(run.phases.filter((p) => p.day).map((p) => p.day))].sort();
  for (const day of days) {
    list.append(el("li", "dayhead", day));
    const noPhoto = find("photo", day)?.label.startsWith("No photo");
    for (const [id, label, optional] of DAY_STEPS) {
      const p = find(id, day);
      if (!p && id === "portions" && noPhoto) renderPhase(list, { state: "skipped", label, detail: "no photo, the estimate is used" });
      else if (!p && optional) continue;
      else renderPhase(list, p, label);
    }
  }
  $("dashPhases").hidden = list.children.length === 0;

  renderTerm(run.lines ?? []);
  renderPrevious();
  renderHist();
}

function nextText(next) {
  if (!next.at) return next.why;
  const s = Math.round((new Date(next.at) - Date.now()) / 1000);
  const when = s > 0 ? (s < 120 ? `in ${s} s` : `at ${new Date(next.at).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}`) : "any moment now";
  return `${next.why} - ${when}`;
}

let termKey = "";
function renderTerm(lines) {
  const term = $("term");
  const key = lines.length + "|" + (lines.at(-1)?.t ?? "");
  if (key === termKey) return; // unchanged: keep the scroll position
  termKey = key;
  const atBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 30;
  term.replaceChildren();
  if (!lines.length) { term.textContent = "Nothing yet."; return; }
  for (const l of lines) {
    const row = el("div", l.l);
    row.append(el("span", "t", clock(l.t) + "  "), document.createTextNode(l.m));
    term.append(row);
  }
  if (atBottom) term.scrollTop = term.scrollHeight;
}

function renderPrevious() {
  const box = $("prevAttempt");
  box.replaceChildren();
  box.hidden = !run?.previous;
  if (!run?.previous) return;
  const d = el("details");
  d.append(el("summary", "", `First attempt${run.previous.failure ? " - " + run.previous.failure.reason : ""}`));
  const t = el("div", "term");
  for (const l of run.previous.lines) { const row = el("div", l.l); row.append(el("span", "t", clock(l.t) + "  "), document.createTextNode(l.m)); t.append(row); }
  d.append(t);
  box.append(d);
}

function renderHist() {
  const ul = $("hist");
  ul.replaceChildren();
  if (!history.length) { ul.append(el("li", "muted", "Nothing yet.")); return; }
  for (const h of [...history].reverse().slice(0, 12)) {
    const li = el("li");
    const when = new Date(h.startedAt).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
    li.append(el("b", h.state === "failed" ? "err" : h.state === "success" ? "ok" : "", h.state === "failed" ? "✗ " : h.state === "success" ? "✓ " : "⟳ "), document.createTextNode(`${when} - ${TRIGGERS[h.trigger] ?? h.trigger}: ${h.summary || h.state}`));
    ul.append(li);
  }
}

// polling: quick while a run is going or right after an upload, slow otherwise, off when hidden
let fastUntil = 0;
let timer = null;
function pollNow() { clearTimeout(timer); poll(); }
async function poll() {
  if ($("viewDash").hidden || document.hidden) return schedule(20_000);
  await refresh();
  const retrySoon = run?.state === "failed" && run.next?.at && Math.abs(new Date(run.next.at) - Date.now()) < 180_000;
  const busy = run?.state === "running" || Date.now() < fastUntil || retrySoon;
  schedule(busy ? 4000 : 20_000);
}
function schedule(ms) { clearTimeout(timer); timer = setTimeout(poll, ms); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollNow(); });
setInterval(() => { if (!$("viewDash").hidden && run) renderDash(); }, 1000); // clocks and countdowns

// ---- questions: "is this part of your lunch?" ---------------------------------------------------------
// When the pipeline is unsure about something on the tray it saves it in portions.json (with a box around
// it on the photo) and sends a notification. The answers go to answers/<date>.json, which starts the run again.
const rawJson = async (path) => {
  const res = await api(path, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
  return res.ok ? res.json() : null;
};
let questions = []; // [{ date, extra }]
let items = []; // the questions of the day being answered
let qIndex = 0;
let qAnswers = {};
let qOpenedOnce = false;
const photoCache = {};

async function checkQuestions() {
  if (!$("token").value) return;
  try {
    const portions = await rawJson("portions.json");
    if (!portions) return;
    const found = [];
    for (const [date, entry] of Object.entries(portions)) {
      if (entry.closed || Date.now() - new Date(date) > 4 * 86400000) continue;
      const open = (entry.extras ?? []).filter((e) => !e.confident);
      if (!open.length) continue;
      const answers = (await rawJson(`answers/${date}.json`)) ?? {};
      for (const e of open) if (!answers[e.id]) found.push({ date, extra: e });
    }
    questions = found;
  } catch {}
  renderBanner();
  if (location.search.includes("q=1") && !qOpenedOnce && questions.length) { qOpenedOnce = true; openModal(); }
}

function renderBanner() {
  const show = questions.length > 0 && $("modal").hidden;
  $("qBanner").hidden = !show;
  if (show) $("qBannerText").textContent = `Not sure about ${questions.map((q) => q.extra.name).join(", ")} on your tray (${questions[0].date}).`;
}

async function cropPhoto(date, box) {
  if (!photoCache[date]) {
    const res = await api(`photos/${date}.jpg`, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
    if (!res.ok) throw new Error("photo not found");
    photoCache[date] = await createImageBitmap(await res.blob());
  }
  const bmp = photoCache[date];
  let [y0, x0, y1, x1] = box ?? [0, 0, 1000, 1000];
  const padX = (x1 - x0) * 0.15 + 20, padY = (y1 - y0) * 0.15 + 20; // a little context around the item
  x0 = Math.max(0, x0 - padX); x1 = Math.min(1000, x1 + padX); y0 = Math.max(0, y0 - padY); y1 = Math.min(1000, y1 + padY);
  const sx = (x0 / 1000) * bmp.width, sy = (y0 / 1000) * bmp.height;
  const sw = ((x1 - x0) / 1000) * bmp.width, sh = ((y1 - y0) / 1000) * bmp.height;
  const scale = Math.min(1, 700 / Math.max(sw, sh));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(sw * scale));
  canvas.height = Math.max(1, Math.round(sh * scale));
  canvas.getContext("2d").drawImage(bmp, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85);
}

async function showQuestion() {
  const q = items[qIndex];
  $("mStep").textContent = `${qIndex + 1} of ${items.length} - ${q.date}`;
  $("mName").value = q.extra.name;
  $("mGrams").value = q.extra.grams;
  $("mNote").textContent = q.extra.note ?? "";
  $("mStatus").textContent = "";
  $("mImg").hidden = true;
  try {
    $("mImg").src = await cropPhoto(q.date, q.extra.box);
    $("mImg").hidden = false;
  } catch (e) {
    $("mStatus").textContent = `Could not load the photo: ${e.message}`;
  }
}

function openModal() {
  if (!questions.length) return;
  const date = questions[0].date;
  items = questions.filter((q) => q.date === date);
  qIndex = 0;
  qAnswers = {};
  $("modal").hidden = false;
  renderBanner();
  showQuestion();
}

async function answerQuestion(action) {
  const q = items[qIndex];
  qAnswers[q.extra.id] = { action, name: $("mName").value.trim() || q.extra.name, grams: Number($("mGrams").value) || q.extra.grams };
  if (qIndex + 1 < items.length) { qIndex++; return showQuestion(); }
  // last one: save all answers of this day
  $("mAdd").disabled = $("mSkip").disabled = true;
  $("mStatus").textContent = "Saving...";
  try {
    const path = `answers/${q.date}.json`;
    const existing = await api(path);
    const sha = existing.ok ? (await existing.json()).sha : undefined;
    const old = existing.ok ? ((await rawJson(path)) ?? {}) : {};
    const body = { message: `Answers for ${q.date}`, content: btoa(unescape(encodeURIComponent(JSON.stringify({ ...old, ...qAnswers }, null, 2) + "\n"))), sha };
    const res = await api(path, { method: "PUT", body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`GitHub said ${res.status}`);
    questions = questions.filter((x) => x.date !== q.date);
    $("modal").hidden = true;
    renderBanner();
    fastUntil = Date.now() + 5 * 60_000;
    showTab("dash");
  } catch (e) {
    $("mStatus").textContent = `Could not save: ${e.message}`;
  } finally {
    $("mAdd").disabled = $("mSkip").disabled = false;
  }
}
$("mAdd").onclick = () => answerQuestion("add");
$("mSkip").onclick = () => answerQuestion("skip");
$("mClose").onclick = () => { $("modal").hidden = true; renderBanner(); };
$("qBannerBtn").onclick = openModal;

// ---- notifications (Web Push) -----------------------------------------------------------------------
const VAPID_PUBLIC = "BLBORrEN5e6bnB7trkpiSmbVxHlZjPEAYcak2e7VzOE0oKsKahmfvIF1pJiJ0MVSz62_BkyBBmEaAg8GTPlrUgA";
const urlBase64ToBytes = (b64) => {
  const raw = atob(b64.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
};

async function editSubscriptions(change) {
  const res = await api("push/subscriptions.json");
  const sha = res.ok ? (await res.json()).sha : undefined;
  const list = res.ok ? ((await rawJson("push/subscriptions.json")) ?? []) : [];
  const next = change(list);
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(next, null, 2) + "\n")));
  const put = await api("push/subscriptions.json", { method: "PUT", body: JSON.stringify({ message: "Notification settings", content, sha }) });
  if (!put.ok) throw new Error(`GitHub said ${put.status}`);
}

async function pushRefresh() {
  const ok = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  if (!ok) { $("pushState").textContent = "Notifications are not supported here."; $("pushBtn").hidden = true; return; }
  const sub = Notification.permission === "granted" ? await (await navigator.serviceWorker.ready).pushManager.getSubscription() : null;
  $("pushBtn").dataset.on = sub ? "1" : "";
  $("pushBtn").textContent = sub ? "Turn notifications off" : "Enable notifications";
  $("pushState").textContent = sub ? "On: you get a notification when the app is unsure about something on your tray."
    : Notification.permission === "denied" ? "Blocked. Allow notifications for this app in the phone's site settings, then try again."
    : "Ask me when the app is not sure about something on your tray.";
}

$("pushBtn").onclick = async () => {
  if (!$("token").value) return void ($("pushState").textContent = "Save your GitHub token first.");
  try {
    const reg = await navigator.serviceWorker.ready;
    if ($("pushBtn").dataset.on) {
      const sub = await reg.pushManager.getSubscription();
      if (sub) { await editSubscriptions((l) => l.filter((s) => s.endpoint !== sub.endpoint)); await sub.unsubscribe(); }
    } else {
      if ((await Notification.requestPermission()) !== "granted") return void pushRefresh();
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToBytes(VAPID_PUBLIC) });
      const json = sub.toJSON();
      await editSubscriptions((l) => [...l.filter((s) => s.endpoint !== json.endpoint), json]);
    }
  } catch (e) {
    $("pushState").textContent = `Failed: ${e.message}`;
    return;
  }
  pushRefresh();
};

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", async (e) => {
    if (e.data?.type === "open-questions") { await checkQuestions(); if (questions.length) openModal(); }
  });
}
pushRefresh();
checkQuestions();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkQuestions(); });
setInterval(() => { if (!document.hidden) checkQuestions(); }, 60_000);
showTab(store.get("tab") === "dash" ? "dash" : "photo");
showMeal();
</script>
